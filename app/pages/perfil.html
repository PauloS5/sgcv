<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil — VetClin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="app-shell">

    <!-- ===================== BARRA LATERAL ===================== -->
    <aside class="sidebar">
      <a href="../index.html" class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 13c2-4 4-6 8-6s6 2 8 6" stroke="#14332A" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M4 13c1 3 4 5 8 5s7-2 8-5" stroke="#14332A" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
          </svg>
        </span>
        VetClin
      </a>
      <nav class="sidebar-nav">
        <a href="dashboard.html">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 13h6V4H4v9ZM14 20h6v-9h-6v9ZM4 20h6v-4H4v4ZM14 4v4h6V4h-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Painel
        </a>
        <a href="pets.html">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.5-9.5-9C1 8 2.5 4 6.5 4c2 0 3.5 1.2 5.5 3.5C14 5.2 15.5 4 17.5 4 21.5 4 23 8 21.5 12 19 16.5 12 21 12 21Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Pets
        </a>
        <a href="agenda.html">
          <svg viewBox="0 0 24 24" fill="none"><path d="M8 3v4M16 3v4M4 9h16M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6"/></svg>
          Agenda
        </a>
        <a href="exames.html">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 3h6l1 4h3v3l-3 2 3 2v3h-3l-1 4H9l-1-4H5v-3l3-2-3-2V7h3l1-4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          Exames
        </a>
        <a href="perfil.html" class="active">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c1.6-3.5 4.4-5.3 7.5-5.3S17.9 16.5 19.5 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Meu perfil
        </a>
      </nav>
      <div class="sidebar-foot">
        <span class="avatar">MF</span>
        <div class="who">
          <strong>Mariana Ferreira</strong>
          <span>Cliente</span>
        </div>
      </div>
    </aside>

    <!-- ===================== CONTEÚDO ===================== -->
    <main class="app-main">
      <div class="app-topbar">
        <div>
          <span class="eyebrow">Conta</span>
          <h1>Meu perfil</h1>
        </div>
      </div>

      <div class="grid grid-2" style="align-items:start;">

        <!-- ============ DADOS CADASTRAIS ============ -->
        <div class="form-card">
          <h3 class="mb-2">Dados cadastrais</h3>
          <p class="text-muted mb-4">Mantenha suas informações atualizadas para facilitar o contato da clínica.</p>
          <form action="#" method="post">
            <div class="field">
              <label for="p-nome">Nome</label>
              <input class="input" type="text" id="p-nome" name="nome" value="Mariana Ferreira">
            </div>
            <div class="form-row">
              <div class="field">
                <label for="p-telefone">Telefone</label>
                <input class="input" type="tel" id="p-telefone" name="telefone" value="(68) 99911-2233">
              </div>
              <div class="field">
                <label for="p-email">E-mail</label>
                <input class="input" type="email" id="p-email" name="email" value="mariana.ferreira@email.com">
              </div>
            </div>
            <div class="field">
              <label for="p-endereco">Endereço</label>
              <input class="input" type="text" id="p-endereco" name="endereco" value="Rua das Palmeiras, 120 — Rio Branco/AC">
            </div>
            <button type="submit" class="btn btn-primary">Salvar alterações</button>
          </form>
        </div>

        <!-- ============ ALTERAR SENHA ============ -->
        <div class="form-card">
          <h3 class="mb-2">Alterar senha</h3>
          <p class="text-muted mb-4">Use uma senha forte, com letras, números e símbolos.</p>
          <form action="#" method="post">
            <div class="field">
              <label for="senha-atual">Senha atual</label>
              <input class="input" type="password" id="senha-atual" name="senha_atual" placeholder="Digite sua senha atual">
            </div>
            <div class="field">
              <label for="senha-nova">Nova senha</label>
              <input class="input" type="password" id="senha-nova" name="senha_nova" placeholder="Digite a nova senha">
            </div>
            <div class="field">
              <label for="senha-confirma">Confirmar nova senha</label>
              <input class="input" type="password" id="senha-confirma" name="senha_confirma" placeholder="Repita a nova senha">
            </div>
            <button type="submit" class="btn btn-secondary">Atualizar senha</button>
          </form>
        </div>

      </div>
    </main>
  </div>

</body>
</html>
