<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — VetClin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- ===================== CABEÇALHO PÚBLICO ===================== -->
  <header class="public-header">
    <div class="container public-nav">
      <a href="../index.html" class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 13c2-4 4-6 8-6s6 2 8 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M4 13c1 3 4 5 8 5s7-2 8-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
          </svg>
        </span>
        VetClin
      </a>
      <nav class="public-links">
        <a href="../index.html#servicos">Serviços</a>
        <a href="../index.html#sobre">Sobre</a>
        <a href="../index.html#contato">Contato</a>
      </nav>
      <div class="public-actions">
        <a href="cadastrar.html" class="btn btn-primary">Criar conta</a>
      </div>
    </div>
  </header>

  <!-- ===================== FORMULÁRIO DE LOGIN ===================== -->
  <main class="auth-shell">
    <div class="auth-card">
      <span class="brand-mark" style="width:44px;height:44px;">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 13c2-4 4-6 8-6s6 2 8 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M4 13c1 3 4 5 8 5s7-2 8-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
        </svg>
      </span>
      <h1>Bem-vindo de volta</h1>
      <p class="lead text-muted">Entre com seus dados para acessar seu painel na VetClin.</p>

      <form action="#" method="post">
        <div class="field">
          <label for="email">E-mail</label>
          <input class="input" type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input class="input" type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>
        <div class="flex-between mb-4">
          <label class="checkbox-row">
            <input type="checkbox" name="lembrar">
            Lembrar de mim
          </label>
          <a href="#" style="font-size:0.86rem; color:var(--color-primary); font-weight:600;">Esqueci a senha</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>

      <p class="auth-foot">
        Ainda não tem conta? <a href="cadastrar.html">Criar uma conta</a>
      </p>
      <p class="auth-foot">
        <a href="../index.html">← Voltar ao início</a>
      </p>
    </div>
  </main>

</body>
</html>
