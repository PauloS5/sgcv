<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — VetClin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- ===================== CABEÇALHO PÚBLICO ===================== -->
  <header class="public-header">
    <div class="container public-nav">
      <a href="../index.html" class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 13c2-4 4-6 8-6s6 2 8 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M4 13c1 3 4 5 8 5s7-2 8-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
          </svg>
        </span>
        VetClin
      </a>
      <nav class="public-links">
        <a href="../index.html#servicos">Serviços</a>
        <a href="../index.html#sobre">Sobre</a>
        <a href="../index.html#contato">Contato</a>
      </nav>
      <div class="public-actions">
        <a href="login.html" class="btn btn-ghost">Entrar</a>
      </div>
    </div>
  </header>

  <!-- ===================== FORMULÁRIO DE CADASTRO (Cliente) ===================== -->
  <main class="auth-shell">
    <div class="auth-card wide">
      <span class="brand-mark" style="width:44px;height:44px;">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 13c2-4 4-6 8-6s6 2 8 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M4 13c1 3 4 5 8 5s7-2 8-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
        </svg>
      </span>
      <h1>Criar minha conta</h1>
      <p class="lead text-muted">Cadastre-se como cliente da VetClin para gerenciar os pets da sua família.</p>

      <form action="#" method="post">
        <div class="field">
          <label for="nome">Nome completo</label>
          <input class="input" type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="cpf">CPF</label>
            <input class="input" type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
          </div>
          <div class="field">
            <label for="telefone">Telefone</label>
            <input class="input" type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
          </div>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input class="input" type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>

        <div class="field">
          <label for="endereco">Endereço</label>
          <input class="input" type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro, cidade/UF">
        </div>

        <div class="form-row">
          <div class="field">
            <label for="senha">Senha</label>
            <input class="input" type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
          </div>
          <div class="field">
            <label for="senha2">Confirmar senha</label>
            <input class="input" type="password" id="senha2" name="senha2" placeholder="Repita a senha" required>
          </div>
        </div>

        <label class="checkbox-row mb-4">
          <input type="checkbox" name="termos" required>
          Li e aceito os termos de uso e a política de privacidade da VetClin.
        </label>

        <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
      </form>

      <p class="auth-foot">
        Já tem uma conta? <a href="login.html">Fazer login</a>
      </p>
      <p class="auth-foot">
        <a href="../index.html">← Voltar ao início</a>
      </p>
    </div>
  </main>

</body>
</html>
